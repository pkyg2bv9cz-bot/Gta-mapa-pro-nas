
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Moje GTA VI mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101820;
}
#map {
  width: 100%;
  height: 100%;
  background: #101820;
}
.leaflet-control-attribution {
  font-size: 10px !important;
}
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BASE = "https://fbritoferreira.github.io/gta6";

const map = L.map("map", {
  crs: L.CRS.Simple,
  minZoom: 0,
  maxZoom: 7,
  zoomSnap: 0.25,
  zoomDelta: 0.5,
  maxBoundsViscosity: 0.8
});

const bounds = L.latLngBounds(
  [-1024, 0],
  [0, 1024]
);

L.tileLayer(
  BASE + "/tiles/day/{z}/{z},{y},{x}.webp",
  {
    tileSize: 256,
    minZoom: 0,
    maxZoom: 7,
    maxNativeZoom: 5,
    noWrap: true,
    bounds: bounds,
    attribution:
      'Map data: <a href="https://github.com/fbritoferreira/gta6">Open GTA 6 Map</a> · CC BY 4.0'
  }
).addTo(map);

map.fitBounds(bounds);
map.setMaxBounds(bounds);

</script>
</body>
</html>
